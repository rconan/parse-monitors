[package]
name = "parse-monitors"
version = "0.4.1"
authors = ["Rod Conan <rconan@gmto.org>"]
edition = "2021"
license = "MIT"
description = "Giant Magellan Telescope Computation Fluid Dynamics Parser"
repository = "https://github.com/rconan/parse-monitors"
documentation = "https://docs.rs/parse-monitors"
readme = "README.md"
categories = ["science", "simulation"]
keywords = ["telescope", "astronomy"]
default-run = "parse-monitors"

[workspace]
members = [
  "domeseeing",
  "domeseeing/atm-fwhm",
  "gmacs",
  "htc-analysis",
  "cfd-youtube",
  "cfd_report",
  "windloads",
  "psf",
]


[workspace.dependencies]
rayon = "1.12.0"
serde-pickle = "1.2.0"
polars = { version = "0.53.0", features = ["decompress"] }
rstar = { version = "0.12.2" }
indicatif = { version = "0.18.4", features = ["rayon"] }
serde = { version = "1.0.228", features = ["derive"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.10"
log = "0.4.29"
glob = "0.3.3"
npyz = { version = "0.9.0", features = ["npz"] }
complot = { version = "0.3.5" }
geotrans = { version = "^1.2.0" }
crseo = "2.5.3"
gmt_dos-clients_domeseeing = { version = "4.0", default-features = false }

[dependencies]
bzip2 = { version = "0.6.1", optional = true }
colorous = "1.0.16"
csv = "1.4.0"
indicatif.workspace = true
nalgebra = { version = "0.34.2", features = ["rand"] }
plotters = { version = "0.3.7", optional = true }
regex = "1.12.3"
serde.workspace = true
structopt = "0.3.26"
rayon.workspace = true
tectonic = { version = "0.16.9", optional = true }
strum = "0.28.0"
strum_macros = "0.28.0"
triangle-rs = { version = "0.*" }
polars = { workspace = true, optional = true }
thiserror = "2.0"
anyhow.workspace = true
flate2 = "1.1.9"
itertools = "0.14.0"
welch-sde = "0.1.0"
rstar = { workspace = true, optional = true }
linya = "0.3.1"
lom = { version = "2.6.3", package = "gmt-lom", features = ["apache"] }
matio-rs = { version = "1.6.3", optional = true }
serde-pickle.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
glob.workspace = true
npyz.workspace = true
complot = { workspace = true, optional = true }
geotrans.workspace = true
gmt_dos-clients_domeseeing = { workspace = true, features = [
  "npyz",
], default-features = false }
object_store = { version = "0.13.2", optional = true }

[features]
default = ["2025"]
plot = ["plotters", "complot"]
xcase = []
b2020 = []
dosio = []
windloading = []
2020 = []
2021 = []
2025 = []

[[bin]]
name = "batch_force"
required-features = ["plot"]

[[bin]]
name = "group-force"
required-features = ["plot"]

[[bin]]
name = "opd_maps"
required-features = ["plot"]

[[bin]]
name = "dome-seeing"
required-features = ["plot"]

[[bin]]
name = "pressure-stats_plots"
required-features = ["polars"]

[[bin]]
name = "asm_temperature-stats_plots"
required-features = ["polars"]

[[bin]]
name = "asm_pressure-stats_plots"
required-features = ["polars"]

[[bin]]
name = "integral_pressures"
required-features = ["polars"]

[[bin]]
name = "cfd_special_report"
required-features = ["tectonic"]

[[bin]]
name = "asm_differential_pressure"
required-features = ["matio-rs"]

[[bin]]
name = "parse-monitors"
path = "src/bin/main.rs"
required-features = ["plot"]

[dev-dependencies]
polars = "0.53.0"
rand = "0.10.1"
tokio = "1.52.1"

[package.metadata.docs.rs]
features = ["plot", "rstar"]
